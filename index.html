<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipes</title>

    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/normalize.css">
</head>

<body>

    <header class="header">

        <!-- Logo -->
        <a href="#" class="logo">
            <img src="images/Logo.png" alt="Head logo">
        </a>

        <!-- Desktop navigation -->
        <nav class="nav desktop-nav">
            <a href="#">Works</a>
            <a href="#">Services</a>
            <a href="#">Contacts</a>
        </nav>

        <!-- Tablet navigation -->
        <nav class="nav tablet-nav">
            <a href="#">Link Item</a>
            <a href="#">Link Item</a>
            <a href="#">Link Item</a>
        </nav>

        <!-- Mobile menu -->
        <button class="menu-icon" aria-label="Open menu">
            •••
        </button>

    </header>


    <main class="hero">

        <!-- Text section -->
        <section class="hero-text">

            <h1>Recipes</h1>

            <p>
                Fusce vehicula dolor arcu, sit amet blandit dolor mollis nec.
                Donec viverra eleifend lacus, vitae ullamcor.
            </p>

        </section>


        <!-- Adaptive image -->
        <picture class="hero-image">

            <!-- Mobile image -->
            <source
                media="(max-width: 600px)"
                srcset="images/Slider-mobile.png"
            >

            <!-- Tablet image -->
            <source
                media="(max-width: 1000px)"
                srcset="images/Slider-tablet.png"
            >

            <!-- Desktop image -->
            <img
                src="images/Slider-Desktop.png"
                alt="Pumpkin soup"
            >

        </picture>


        <!-- Arrow -->
        <div class="arrow">
            ↓
        </div>

    </main>

</body>

</html>
